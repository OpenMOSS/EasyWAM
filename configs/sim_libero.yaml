# @package _global_

defaults:
  - train
  - override /task: libero_easywam_mot_wan22
  - _self_

ckpt: null
gpu_id: 0

model:
  backbone:
    load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  num_trials: 50
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Runtime behavior
  env_num: 1
  num_steps_wait: 30
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  visualize_future_video: false
  video_mode: none
  progress: false
  timing_enabled: false
  torch_compile: false
  # reduce-overhead uses CUDA graphs when eligible and is suited to repeated batch-1 inference.
  torch_compile_mode: reduce-overhead
  torch_compile_backend: inductor
  torch_compile_fullgraph: false
  torch_compile_dynamic: false
  torch_compile_options: {}

  # Action inference
  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu

  # Optional external inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8
  # 1 selects EGL; values greater than 1 select CPU OSMesa rendering.
  max_tasks_per_gpu: 2

# Internal worker arguments populated by run_libero_manager.py.
WORKER:
  task_file: null
  worker_index: 0

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
