# @package _global_

defaults:
  - /train
  - override /task: libero_easywam_mot_wan22
  - _self_

ckpt: null
gpu_id: 0

model:
  backbone:
    load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial_object
  task_id: 0
  num_trials: 50
  output_dir: ./evaluate_results/libero_pro/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}
  libero_pro_root: ./third_party/LIBERO-PRO
  libero_pro_data_root: ${EVALUATION.libero_pro_root}/libero/libero
  libero_pro_config_path: null

  video_mode: none
  visualize_future_video: false
  progress: false
  timing_enabled: false
  prompt_source: environment_language
  torch_compile: false
  torch_compile_mode: reduce-overhead
  torch_compile_backend: inductor
  torch_compile_fullgraph: false
  torch_compile_dynamic: false
  torch_compile_options: {}

  num_steps_wait: 10
  max_steps: null
  require_unique_initial_states: true
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false

  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu

  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_suite_names:
    - libero_goal
    - libero_spatial
    - libero_10
    - libero_object
  perturbations:
    - object
    - position
    - semantic
    - task
    - environment
  task_ids: null
  num_gpus: 4
  gpu_ids: null
  workers_per_gpu: 2
  env_num_per_worker: 4
  inference_batch_size: 4
  inference_batch_wait_ms: 10
  prompt_cache_size: 40

WORKER:
  task_file: null
  task_cursor: null
  worker_index: 0

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
  job_logging:
    handlers:
      file:
        filename: /dev/null
