# @package _global_

defaults:
  - /train
  - override /task: robocasa_easywam_mot_wan22
  - _self_

ckpt: null
gpu_id: 0
# RoboCasa's reference evaluation uses seed 7.
seed: 7

model:
  backbone:
    load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  robocasa_root: ./third_party/robocasa
  task_set: atomic_seen
  task_name: null
  split: pretrain
  num_trials: 50
  output_dir: ./evaluate_results/robocasa/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  replan_steps: 16
  video_mode: none
  video_fps: 20
  progress: false
  timing_enabled: false
  torch_compile: false
  torch_compile_mode: reduce-overhead
  torch_compile_backend: inductor
  torch_compile_fullgraph: false
  torch_compile_dynamic: false
  torch_compile_options: {}

  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu

  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_file: null
  task_sets:
    - atomic_seen
    - composite_seen
    - composite_unseen
  num_gpus: 8
  gpu_ids: null
  workers_per_gpu: 5
  env_num_per_worker: 16
  inference_batch_size: 4
  inference_batch_wait_ms: 3
  prompt_cache_size: 40

# Internal worker arguments populated by run_robocasa_manager.py.
WORKER:
  task_file: null
  task_cursor: null
  worker_index: 0

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
  job_logging:
    handlers:
      file:
        filename: /dev/null
