# @package _global_

defaults:
  - /train
  - override /task: robotwin_easywam_mot_wan22
  - _self_

ckpt: null
gpu_id: 0

model:
  backbone:
    load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  robotwin_root: third_party/RoboTwin
  policy_name: easywam_policy
  env_cfg_type: arx_x5
  action_type: joint
  task_name: null
  task_config: demo_randomized
  instruction_type: null
  eval_num_episodes: 100
  output_dir: ./evaluate_results/robotwin/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Action inference
  action_horizon: null
  replan_steps: 24
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  timing_enabled: false
  torch_compile: false
  # reduce-overhead uses CUDA graphs when eligible and is suited to repeated batch-1 inference.
  torch_compile_mode: reduce-overhead
  torch_compile_backend: inductor
  torch_compile_fullgraph: false
  torch_compile_dynamic: false
  torch_compile_options: {}
  # Runtime inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  enabled: false
  num_gpus: 8
  gpu_ids: null
  workers_per_gpu: 5
  env_num_per_worker: 16
  inference_batch_size: 4
  inference_batch_wait_ms: 3
  prompt_cache_size: 40

# Internal worker arguments populated by run_robotwin_manager.py.
WORKER:
  task_file: null
  task_cursor: null
  worker_index: 0

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
  job_logging:
    handlers:
      file:
        filename: /dev/null
