# @package _global_
defaults:
  - /train
  - override /task: vlabench_easywam_mot_wan22
  - _self_

ckpt: null
model:
  backbone:
    load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  vlabench_root: ./third_party/VLABench
  sim_python: python
  # OSMesa is the CPU-only software rendering option; EGL is useful on GPU hosts.
  render_backend: osmesa
  # Uniform official episode count; track 2 / insert_flower has only 10 configs.
  num_trials: 10
  tracks:
    - track_1_in_distribution
    - track_2_cross_category
    - track_3_common_sense
    - track_4_semantic_instruction
    - track_6_unseen_texture
  tasks: null
  custom_track_file: null
  output_dir: ./evaluate_results/vlabench/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}
  dataset_stats_path: null
  action_horizon: null
  # Diagnostic override only; formal runs use the official task horizon.
  episode_horizon: null
  replan_steps: 4
  num_inference_steps: ${eval_num_inference_steps}
  text_cfg_scale: 1.0
  negative_prompt: ""
  sigma_shift: null
  rand_device: cpu
  device: cuda
  gripper_threshold: 0.5
  gripper_width: 0.04
  video_mode: none
  episode_timeout_seconds: 600
  startup_timeout_seconds: 600
  request_timeout_seconds: 300
  torch_compile: false
  torch_compile_mode: reduce-overhead
  torch_compile_backend: inductor
  torch_compile_fullgraph: false
  torch_compile_dynamic: false
  torch_compile_options: {}

MULTIRUN:
  create_only: false
  num_gpus: 1
  gpu_ids: null
  workers_per_gpu: 1
  env_num_per_worker: 2
  inference_batch_size: 2
  inference_batch_wait_ms: 3
  prompt_cache_size: 20
