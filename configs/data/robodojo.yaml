train:
  _target_: data.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/robodojo-lerobot-v3.0
  shape_meta:
    images:
      - key: cam_high
        raw_shape: [3, 480, 640]
        shape: [3, 256, 320]
      - key: cam_left_wrist
        raw_shape: [3, 480, 640]
        shape: [3, 128, 160]
      - key: cam_right_wrist
        raw_shape: [3, 480, 640]
        shape: [3, 128, 160]
    action:
      - key: default
        raw_shape: 14 # before transform
        shape: 14 # after transform
    state:
      - key: default
        raw_shape: 14 # before transform
        shape: 14 # after transform
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 action, 9 video frames
  video_size: [384, 320] # final resize video
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: true
  pretrained_norm_stats: ./data/robodojo-lerobot-v3.0/dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: "robotwin"
  processor:
    _target_: data.lerobot.processors.wam_processor.WAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 3
    stack_images: false
    include_gt_action: false
    action_output_dim: 14
    proprio_output_dim: 14

    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: "z-score"
    norm_exception_mode: null

    action_state_merger:
      _target_: data.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      cam_high:
        - _target_: data.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [256, 320]
        - _target_: torchvision.transforms.ColorJitter
          brightness: 0.2
          contrast: 0.2
          saturation: 0.2
          hue: 0.0
      cam_left_wrist:
        - _target_: data.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [128, 160]
        - _target_: torchvision.transforms.ColorJitter
          brightness: 0.2
          contrast: 0.2
          saturation: 0.2
          hue: 0.0
      cam_right_wrist:
        - _target_: data.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [128, 160]
        - _target_: torchvision.transforms.ColorJitter
          brightness: 0.2
          contrast: 0.2
          saturation: 0.2
          hue: 0.0
    val_transforms:
      cam_high:
        - _target_: data.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [256, 320]
      cam_left_wrist:
        - _target_: data.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [128, 160]
      cam_right_wrist:
        - _target_: data.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [128, 160]
  text_embedding_cache_dir: ./data/text_embeds_cache/robodojo/${model.backbone.name}
  context_len: ${model.backbone.tokenizer_max_len}
  text_encoder_id: ${model.backbone.text_encoder_id}
  mixed_precision: ${mixed_precision}

