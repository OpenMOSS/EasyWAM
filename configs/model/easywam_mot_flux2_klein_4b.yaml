defaults:
  - backbone: flux2_klein_4b
  - _self_

_target_: runtime.create_easywam_mot
attention_backend: ${model.backbone.attention_backend}
state_dim: ${data.train.processor.proprio_output_dim}
projector_hidden_dim: 64
action_dit_pretrained_path: ${model.backbone.action_dit_pretrained_path}
skip_dit_load_from_pretrain: false

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  mlp_ratio: 4.0
  max_action_horizon: 64
  attention_backend: ${model.backbone.attention_backend}
  use_gradient_checkpointing: ${model.backbone.use_gradient_checkpointing}

video_scheduler: ${model.backbone.video_scheduler}

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 0.5
  lambda_action: 1.0
