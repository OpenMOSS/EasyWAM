# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 16
num_workers: 8
dataloader_prefetch_factor: 16
dataloader_persistent_workers: true
dataloader_pin_memory: true
dataloader_worker_threads: 1

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
warmup_ratio: 0.05
max_steps: 1000
log_every: 10
save_every: 100
eval_every: 50
eval_num_inference_steps: 10
# Save one stitched prediction / VAE reconstruction / GT video per rank at each eval.
eval_save_video: false

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null

# execution
# 1 preserves per-sample VAE execution; null processes the full batch.
vae_micro_batch_size: null
# Reuse static cross-attention projections only within one inference call.
inference_cross_kv_reuse: true

# wandb
wandb:
  enabled: false
  workspace: null
  project: easywam
  name: train
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
