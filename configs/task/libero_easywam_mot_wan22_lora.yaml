# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: easywam_mot_wan22_lora
  - _self_

batch_size: 16
num_workers: 8

lr_scheduler_type: cosine
learning_rate: 1e-4
max_steps: 20000
log_every: 100
save_every: 2000
eval_every: 1000
eval_num_inference_steps: 10

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
