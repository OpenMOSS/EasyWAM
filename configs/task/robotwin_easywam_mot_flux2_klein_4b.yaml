# @package _global_

defaults:
  - override /data: robotwin
  - override /model: easywam_mot_flux2_klein_4b
  - _self_

data:
  train:
    text_embedding_cache_dir: ???
  val:
    text_embedding_cache_dir: ???

batch_size: 12
num_workers: 8
lr_scheduler_type: cosine
learning_rate: 1.0e-4
max_steps: 30000
log_every: 100
save_every: 3000
# FLUX.2 currently trains one endpoint image; EasyWAM's video-rollout evaluator
# is intentionally disabled until the image evaluator is wired in.
eval_every: 0
eval_num_inference_steps: 10
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: null
