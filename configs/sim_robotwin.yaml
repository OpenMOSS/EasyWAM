# @package _global_

defaults:
  - train
  - override /task: robotwin_easywam_mot_wan22
  - _self_

ckpt: null
gpu_id: 0

model:
  backbone:
    load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  robotwin_root: third_party/RoboTwin
  policy_name: easywam_policy
  task_name: null
  task_config: demo_randomized
  instruction_type: unseen
  eval_num_episodes: 100
  output_dir: ./evaluate_results/robotwin/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Action inference
  action_horizon: null
  replan_steps: 24
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  timing_enabled: false
  torch_compile: false
  skip_get_obs_within_replan: true

  # Runtime inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  enabled: false
  num_gpus: 8
  max_tasks_per_gpu: 2

# Internal worker arguments populated by run_robotwin_manager.py.
WORKER:
  task_file: null
  worker_index: 0

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
